[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-gateway"
version = "0.1.0"
description = "Privacy-preserving LLM/VLM gateway — detects protected information, sanitizes only what policy requires, and restores scope-scoped tokens in the response."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "PyYAML>=6.0",
    "cryptography>=43",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Document parsing. Kept optional so the gateway can start without them —
# a missing parser must fail closed for that content type, never pass it through.
documents = [
    "pypdf>=5.1",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=11.0",
]
ocr = ["rapidocr-onnxruntime>=1.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]     # asserts are used as invariants in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*", "pypdf.*", "docx.*", "openpyxl.*"]
ignore_missing_imports = true
